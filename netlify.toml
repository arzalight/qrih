[build]
  command = "npm run lint && npm run typecheck && npm test && npm run preflight && node scripts/netlify-next-build.mjs && npm run preflight"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Adaptador OpenNext oficial actual, sin fijar versión ni exportar estático.
# Explícito porque el build por ZIP no lo añadió automáticamente.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Variables y secretos se definen en Netlify por entorno, nunca en este archivo.
