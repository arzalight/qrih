[build]
command = "npm run lint && npm run typecheck && npm test && npm run preflight && node scripts/netlify-next-build.mjs && npm run preflight"
publish = ".next"

[build.environment]
NODE_VERSION = "24"
QRIH_NETLIFY_BUILD = "true"

[[plugins]]
package = "@netlify/plugin-nextjs"

# Variables y secretos se definen en Netlify por entorno, nunca en este archivo.
